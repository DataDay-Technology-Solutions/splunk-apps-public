# SA-attack-replay — Blast Radius for Splunk Enterprise Security
# Splunk Dashboard Contest 2026 entry
#
# Dependency: Splunk_SA_CIM (https://splunkbase.splunk.com/app/1621)
#   - Recommended for accelerated `| tstats` performance against CIM data models.
#   - Dashboard still works without it (queries use `summariesonly=false` fallback).

[install]
is_configured = true
state = enabled
build = 29

[ui]
is_visible = true
label = Attack Replay
show_in_nav = true

[launcher]
author = Steve Koelpin (@skoelpin) / DataDay Technology Solutions
description = DVR-style attack replay that scrubs multi-phase kill chains (APT, Ransomware, Insider Threat) across an animated topology — plus a quantified Detection Coverage Score and per-tactic MITRE gap table that pinpoint which observed techniques have no detection. CIM-compliant and queried via `| tstats`, so the same dashboard runs on bundled demo data or your real CIM-tagged production data.
version = 1.9.4

[package]
id = SA-attack-replay
check_for_updates = false
