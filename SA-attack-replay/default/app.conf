# SA-attack-replay — Blast Radius for Splunk Enterprise Security
# Community early-access release — DataDay Technology Solutions
#
# Dependency: Splunk_SA_CIM (https://splunkbase.splunk.com/app/1621)
#   - Recommended for accelerated `| tstats` performance against CIM data models.
#   - Dashboard still works without it (queries use `summariesonly=false` fallback).

[install]
is_configured = true
state = enabled
build = 32

[ui]
is_visible = true
label = Attack Replay
show_in_nav = true

[launcher]
author = Steve Koelpin (@skoelpin) / DataDay Technology Solutions
description = A DVR to replay cyberattacks — rewind, pause, and scrub multi-phase kill chains (APT, Ransomware, Insider Threat) across a host-swimlane incident timeline. v2.0 adds a full Splunk Enterprise Security layer: Risk-Based Alerting with a live risk-accrual timeline that trips Risk Notables at threshold, an Incident-Review notable queue, and correlation-search-aware Detection Coverage. Demo mode SEEDS ES-shaped data (index=risk, index=notable) so it behaves exactly as it would against a live ES deployment — and the same panels read your real RBA risk + notables when ES is present.
version = 2.0.0

[package]
id = SA-attack-replay
check_for_updates = false
