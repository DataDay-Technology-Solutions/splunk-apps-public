# datamodels.conf -- SA-attack-replay
# Self-contained CIM-compatible data models. Wraps tag-based search on the
# sa_attack_sim index so Live mode works WITHOUT Splunk_SA_CIM installed.
# If Splunk_SA_CIM IS installed, those models take precedence (export=system).

[Authentication]
acceleration = 0
acceleration.cron_schedule = */15 * * * *
acceleration.earliest_time = -7d
disabled = 0

