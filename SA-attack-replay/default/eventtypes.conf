# eventtypes.conf — SA-attack-replay
# Matches on orig_sourcetype field (the streamer preserves real sourcetype here
# while indexing everything under flat sourcetype=attack_sim:events).

[ar_windows_logon_success]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" EventCode=4624

[ar_windows_logon_failure]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" EventCode=4625

[ar_kerberos_ticket]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" (EventCode=4768 OR EventCode=4769)

[ar_windows_process_create]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" EventCode=4688

[ar_sysmon_process_create]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Sysmon" EventCode=1

[ar_sysmon_process_access]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Sysmon" EventCode=10

[ar_sysmon_image_load]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Sysmon" EventCode=7

[ar_sysmon_file_create]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Sysmon" EventCode=11

[ar_sysmon_network_conn]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Sysmon" EventCode=3

[ar_security_log_cleared]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" EventCode=1102

[ar_security_task_created]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" EventCode=4698

[ar_security_dcsync]
search = index=sa_attack_sim orig_sourcetype="WinEventLog:Security" EventCode=4662

[ar_stream_http]
search = index=sa_attack_sim orig_sourcetype="stream:http"

[ar_stream_mysql]
search = index=sa_attack_sim orig_sourcetype="stream:mysql"

[ar_stream_tcp]
search = index=sa_attack_sim orig_sourcetype="stream:tcp"

[ar_stream_dns]
search = index=sa_attack_sim orig_sourcetype="stream:dns"

[ar_linux_auth]
search = index=sa_attack_sim orig_sourcetype="linux:auth"

[ar_exchange_mgmt]
search = index=sa_attack_sim orig_sourcetype="MSExchange:Management"

[ar_attack_sim_creds]
search = index=sa_attack_sim orig_sourcetype="attack_sim:creds"

[ar_attack_sim_notable]
search = index=sa_attack_sim orig_sourcetype="attack_sim:notable"
