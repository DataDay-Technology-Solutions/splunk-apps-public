# indexes.conf — SA-attack-replay
# Defines the single demo index used by Blast Radius dashboards.
# Small footprint (500MB cap, 30-day retention) — this is synthetic
# attack-simulation data only, never production telemetry.
# Standard hot/warm/cold/thawed paths under $SPLUNK_DB.

[sa_attack_sim]
homePath   = $SPLUNK_DB/sa_attack_sim/db
coldPath   = $SPLUNK_DB/sa_attack_sim/colddb
thawedPath = $SPLUNK_DB/sa_attack_sim/thaweddb
datatype   = event
# Retention: 30 days
frozenTimePeriodInSecs = 2592000
# Size cap: 500 MB total (demo data only)
maxTotalDataSizeMB = 500
maxHotBuckets = 3
maxWarmDBCount = 10
# Allow events with timestamps up to 24h in the past/future
# (demo streamer writes events offset from "now" by up to ~1h)
maxDataSize = auto
enableDataIntegrityControl = false
repFactor = 0

# Summary index for KPI rollups (Fix F — real Splunk ops pattern)
[summary_sa_attack_replay]
homePath = $SPLUNK_DB/summary_sa_attack_replay/db
coldPath = $SPLUNK_DB/summary_sa_attack_replay/colddb
thawedPath = $SPLUNK_DB/summary_sa_attack_replay/thaweddb
maxTotalDataSizeMB = 500
frozenTimePeriodInSecs = 7776000

# ===========================================================================
# v2.0.0 — Enterprise Security Edition.
# Blast Radius now seeds, and reads back, Splunk ES-shaped data so the demo
# exercises the SAME code path as a live ES deployment:
#   index=risk    — Risk-Based Alerting (RBA) risk events (Risk data model)
#   index=notable — adaptive-response notable events (Incident Review)
#
# IMPORTANT (ES coexistence): Splunk Enterprise Security ships its OWN `risk`
# and `notable` index definitions in its premium apps. When ES is installed,
# ES's definitions win index-config precedence and Blast Radius writes into
# the REAL ES indexes — exactly what you want. These stanzas exist so the app
# is SELF-CONTAINED on a vanilla Splunk (no ES): the seeded RBA/notable data
# still has a home, and every Enterprise-Security panel renders identically.
# Synthetic data only; small caps; safe to leave in place alongside ES.
# ===========================================================================
[risk]
homePath   = $SPLUNK_DB/risk/db
coldPath   = $SPLUNK_DB/risk/colddb
thawedPath = $SPLUNK_DB/risk/thaweddb
datatype   = event
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 500
repFactor = 0

[notable]
homePath   = $SPLUNK_DB/notable/db
coldPath   = $SPLUNK_DB/notable/colddb
thawedPath = $SPLUNK_DB/notable/thaweddb
datatype   = event
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 500
repFactor = 0
