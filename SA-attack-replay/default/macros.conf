iseval = 0

[ar_scenario_filter(1)]
args = scenario
definition = (scenario_id="$scenario$")
iseval = 0

[ar_compromised_count_demo(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` | stats dc(orig_host) AS count | append [| makeresults | eval count=0 | fields count] | stats max(count) AS count
iseval = 0

[ar_connection_count_demo(3)]
args = entity, scenario, protocol_filter
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` dest_port=* | where case("$protocol_filter$"="all",1=1,"$protocol_filter$"="*",1=1,"$protocol_filter$"="rdp",dest_port=3389,"$protocol_filter$"="smb",dest_port=445,"$protocol_filter$"="ssh",dest_port=22,"$protocol_filter$"="kerberos",dest_port=88,"$protocol_filter$"="http",(dest_port=80 OR dest_port=443),"$protocol_filter$"="dns",dest_port=53) | stats count | fillnull value=0 count
