definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` risk_score=* | stats max(risk_score) AS count | append [| makeresults | eval count=0 | fields count] | stats max(count) AS count
iseval = 0

[ar_compromised_count_live(2)]
args = entity, scenario
definition = tstats summariesonly=false dc(Authentication.dest) AS count FROM datamodel=Authentication.Authentication WHERE Authentication.action="success" AND index!=sa_attack_sim AND (Authentication.dest="$entity$" OR Authentication.user="$entity$" OR "$entity$"="*") | append [| makeresults | eval count=0 | fields count] | stats max(count) AS count
iseval = 0

[ar_connection_count_live(3)]
