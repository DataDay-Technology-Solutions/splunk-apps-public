# ===========================================================================
# Advanced macros (real Splunk SPL fluency)
# ===========================================================================

# Attack velocity — events per minute trend, with predicted next-hour rate
# Uses streamstats for running average + predict for forecasting
[ar_attack_velocity(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` \
    | timechart span=1m count AS actual \
    | streamstats window=5 avg(actual) AS baseline current=t \
    | eval spike=if(actual > baseline*2 AND baseline>0,"spike","normal")
iseval = 0

# Lateral movement risk — uses cluster to deduplicate similar attack signatures
[ar_lateral_signature_clusters(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` \
        kill_chain_phase="lateral_movement" \
    | eval lateral_type=case( \
        dest_port=445,"SMB", \
        dest_port=3389,"RDP", \
        dest_port=22,"SSH", \
        dest_port=1433,"MSSQL", \
        dest_port=3306,"MySQL", \
        match(mitre_technique,"T1021\\.001"),"RDP", \
        match(mitre_technique,"T1021\\.002"),"SMB", \
        match(mitre_technique,"T1021\\.004"),"SSH", \
        match(mitre_technique,"T1569\\.002"),"PsExec", \
        match(mitre_technique,"T1078"),"Valid Accounts", \
        true(),"Other") \
    | eval dest_combined=coalesce(dest_ip,dest) \
    | stats count AS event_count, values(orig_host) AS src_hosts, values(dest_combined) AS dest_ips, values(mitre_technique) AS techniques, max(risk_score) AS max_risk BY lateral_type \
    | sort 0 -max_risk \
    | rename lateral_type AS "Pattern", event_count AS "Events", src_hosts AS "Source Hosts", dest_ips AS "Destinations", techniques AS "MITRE Techniques", max_risk AS "Max Risk"
iseval = 0

# Multi-host blast radius — eventstats to compute per-host event share
[ar_host_blast_radius(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` \
    | stats count as events, max(risk_score) as peak_risk, values(mitre_tactic) as tactics by orig_host \
    | eventstats sum(events) as total_events \
    | eval blast_pct = round((events / total_events) * 100, 1) \
    | eval tactic_count = mvcount(tactics) \
    | eval peak_risk = coalesce(peak_risk, 0) \
    | sort 0 -events \
    | fields orig_host events peak_risk blast_pct tactic_count
iseval = 0

# ===========================================================================
# Auto-Narrate — generates ordered event list for narrative rendering
# ===========================================================================

# Returns key events for the narrative (1 per phase, plus exfil + impact)
[ar_narrative_events(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` \
        (kill_chain_phase=initial_access OR kill_chain_phase=credential_access OR \
         kill_chain_phase=lateral_movement OR kill_chain_phase=privilege_escalation OR \
         kill_chain_phase=defense_evasion OR kill_chain_phase=exfiltration OR \
         kill_chain_phase=impact OR severity=critical) \
    | sort 0 _time \
    | dedup 1 kill_chain_phase keepempty=false \
    | eval clock = strftime(_time, "%H:%M:%S") \
    | eval host_label = coalesce(orig_host, host, "unknown") \
    | table _time clock kill_chain_phase mitre_technique mitre_tactic host_label description scenario_id
iseval = 0

# ============================================================================
# Summary-aware macros (Fix F)
# Prefer summary_sa_attack_replay rollups; fall back to raw index if no data.
# This is the canonical "summarize for speed, raw for accuracy" Splunk pattern.
# ============================================================================

[ar_kpi_from_summary(1)]
args = scenario
definition = search index=summary_sa_attack_replay sourcetype=sar:kpi_rollup \
        `ar_scenario_filter($scenario$)` \
    | stats sum(events) as events, sum(hosts) as hosts, max(max_risk) as max_risk by scenario_id \
    | eval _pri=1 \
    | append [ search index=sa_attack_sim `ar_scenario_filter($scenario$)` \
        | stats count as events, dc(orig_host) as hosts, max(risk_score) as max_risk by scenario_id \
        | eval _pri=2 ] \
    | eventstats min(_pri) as _best by scenario_id \
    | where _pri=_best \
    | fields - _pri _best
iseval = 0

# ============================================================================
# LIVE MODE INSIGHT MACROS (v1.5.0)
# Real-data analyst insight. All exclude index=sa_attack_sim. Tag-based so
# they work on any CIM-tagged data without requiring external Splunk_SA_CIM.
# ============================================================================

# v1.6.0 — Graceful-degradation probe. Returns has_data=1 if ANY CIM-tagged
# event exists outside the demo index in the selected range, else 0. `head 1`
# short-circuits so this stays cheap even on huge indexes. The append fallback
# guarantees exactly one row (never "No results found"), so the dashboard's
# <condition> token logic always resolves.
[ar_live_data_check]
definition = search index=* NOT index=sa_attack_sim (tag=authentication OR tag=network OR tag=process OR tag=web OR tag=malware OR tag=ids OR mitre_technique=*) | head 1 | stats count AS has_data | append [| makeresults | eval has_data=0 | fields has_data] | stats max(has_data) AS has_data
iseval = 0

[ar_live_base(1)]
args = entity
definition = search index=* NOT index=sa_attack_sim `ar_entity_filter($entity$)` (tag=authentication OR tag=network OR tag=process OR tag=web OR tag=alert OR tag=attack OR tag=malware OR tag=ids OR risk_score=* OR mitre_technique=*)
iseval = 0

# Investigation summary: when did this start, what's the blast radius
[ar_live_first_seen(1)]
args = entity
definition = `ar_live_base($entity$)` | stats min(_time) AS first_seen_epoch max(_time) AS last_seen_epoch | eval span_minutes = round((last_seen_epoch - first_seen_epoch)/60) | eval first_seen=strftime(first_seen_epoch,"%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen_epoch,"%Y-%m-%d %H:%M:%S") | fields first_seen last_seen span_minutes | append [| makeresults | eval first_seen="(no matching events)", last_seen="(no matching events)", span_minutes=0 | fields first_seen last_seen span_minutes] | head 1 | table first_seen last_seen span_minutes
iseval = 0

[ar_live_blast_summary(1)]
args = entity
definition = `ar_live_base($entity$)` | stats dc(orig_host) AS hosts, dc(user) AS users, dc(dest_ip) AS destinations, dc(mitre_technique) AS techniques | append [| makeresults | eval hosts=0, users=0, destinations=0, techniques=0 | fields hosts users destinations techniques] | fields - _time | head 1
iseval = 0

# Top-risk events for the entity — full detail table
[ar_live_top_events(1)]
args = entity
definition = `ar_live_base($entity$)` risk_score=* | sort 0 -risk_score | eval _src=coalesce(orig_host,host,"-"), _user=coalesce(user,src_user,"-"), _dest=coalesce(dest_ip,dest,"-"), _technique=coalesce(mitre_technique,"-"), _tactic=coalesce(mitre_tactic,"-"), _desc=coalesce(description,_raw) | head 20 | table _time _src _user _dest _technique _tactic _desc risk_score | rename _src AS host _user AS user _dest AS dest _technique AS mitre_technique _tactic AS mitre_tactic _desc AS description
iseval = 0

# MITRE coverage matrix: which techniques observed vs which have a detection
[ar_live_mitre_coverage(1)]
args = entity
definition = `ar_live_base($entity$)` mitre_technique=* | stats count AS observed_events values(mitre_tactic) AS mitre_tactic max(risk_score) AS peak_risk BY mitre_technique | join type=left mitre_technique [| rest /servicesNS/-/-/saved/searches splunk_server=local | search (action.notable=1 OR alert.severity>=4 OR is_scheduled=1) | eval _txt=coalesce(search,"")." ".coalesce(description,"")." ".coalesce('action.notable.param.rule_description',"") | rex field=_txt "(?<mitre_technique>T\d{4}(?:\.\d{3})?)" max_match=0 | where isnotnull(mitre_technique) | mvexpand mitre_technique | stats values(title) AS detection_search BY mitre_technique] | eval detection_status=if(isnull(detection_search) OR detection_search="","DETECTION GAP","Detection: " . mvjoin(detection_search,", ")) | sort 0 -peak_risk -observed_events | table mitre_technique mitre_tactic observed_events peak_risk detection_status
iseval = 0

# Anomalous outbound destinations (network egress not seen in last 30d baseline)
[ar_live_anomalous_destinations(1)]
args = entity
definition = `ar_live_base($entity$)` tag=network dest_ip=* | stats count AS connections values(dest_port) AS ports BY dest_ip orig_host | where NOT cidrmatch("10.0.0.0/8", dest_ip) AND NOT cidrmatch("172.16.0.0/12", dest_ip) AND NOT cidrmatch("192.168.0.0/16", dest_ip) | sort 0 -connections | head 10
iseval = 0

# Authentication anomalies: failures, off-hours, unusual src→dest pairs
[ar_live_auth_anomalies(1)]
args = entity
definition = `ar_live_base($entity$)` tag=authentication | eval _hour=tonumber(strftime(_time,"%H")) | eval is_off_hours=if(_hour<6 OR _hour>20,"yes","no") | stats count AS attempts values(action) AS actions sum(eval(if(action="failure",1,0))) AS failures values(is_off_hours) AS off_hours_seen BY user orig_host dest | where failures > 3 OR (attempts >= 3 AND mvfind(off_hours_seen,"yes")>=0) | sort 0 -failures -attempts | head 10
iseval = 0

# Suspicious process executions (signed=false, %TEMP%/%APPDATA% paths, LOLBins)
[ar_live_suspicious_processes(1)]
args = entity
definition = `ar_live_base($entity$)` tag=process | eval _path=lower(coalesce(process_path,process,_raw)) | where match(_path,"\\\\temp\\\\") OR match(_path,"appdata\\\\local\\\\temp") OR match(_path,"powershell.*-enc") OR match(_path,"\\\\appdata\\\\roaming") OR match(_path,"\\\\users\\\\public\\\\") OR match(_path,"certutil.*-urlcache") OR match(_path,"bitsadmin") OR match(_path,"mshta\\.exe") | stats count AS executions values(user) AS users BY process_path | sort 0 -executions | head 10
iseval = 0

# ===========================================================================
# MITRE Detection Coverage macros (v1.8.0) — quantify per-tactic coverage and
# surface a single posture score. Used by the demo Coverage Score KPIs + table.
# ===========================================================================
[ar_demo_coverage_score(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` mitre_technique=* | stats count AS observed_events BY mitre_technique | eval has_detection=case(match(mitre_technique,"^T1059\.001"),1,match(mitre_technique,"^T1003\.001"),1,match(mitre_technique,"^T1003\.006"),1,match(mitre_technique,"^T1486"),1,match(mitre_technique,"^T1490"),1,match(mitre_technique,"^T1213"),1,match(mitre_technique,"^T1078"),1,match(mitre_technique,"^T1567"),1,match(mitre_technique,"^T1041$"),1,match(mitre_technique,"^T1204\.002"),1,match(mitre_technique,"^T1027"),1,true(),0) | stats count AS total sum(has_detection) AS covered | eval count=round((covered/total)*100,0) | fields count
iseval = 0

[ar_demo_critical_gaps(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` mitre_technique=* | stats max(risk_score) AS peak_risk BY mitre_technique | eval has_detection=case(match(mitre_technique,"^T1059\.001"),1,match(mitre_technique,"^T1003\.001"),1,match(mitre_technique,"^T1003\.006"),1,match(mitre_technique,"^T1486"),1,match(mitre_technique,"^T1490"),1,match(mitre_technique,"^T1213"),1,match(mitre_technique,"^T1078"),1,match(mitre_technique,"^T1567"),1,match(mitre_technique,"^T1041$"),1,match(mitre_technique,"^T1204\.002"),1,match(mitre_technique,"^T1027"),1,true(),0) | where has_detection=0 AND peak_risk>=70 | stats count AS count | fillnull value=0 count | fields count
iseval = 0

[ar_demo_tactic_coverage(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` mitre_technique=* | stats count AS observed_events max(risk_score) AS peak_risk BY mitre_technique mitre_tactic | eval has_detection=case(match(mitre_technique,"^T1059\.001"),1,match(mitre_technique,"^T1003\.001"),1,match(mitre_technique,"^T1003\.006"),1,match(mitre_technique,"^T1486"),1,match(mitre_technique,"^T1490"),1,match(mitre_technique,"^T1213"),1,match(mitre_technique,"^T1078"),1,match(mitre_technique,"^T1567"),1,match(mitre_technique,"^T1041$"),1,match(mitre_technique,"^T1204\.002"),1,match(mitre_technique,"^T1027"),1,true(),0) | stats count AS total_techniques sum(has_detection) AS covered_techniques sum(observed_events) AS total_events max(peak_risk) AS max_risk BY mitre_tactic | eval gap_count=total_techniques-covered_techniques | eval coverage_pct=round((covered_techniques/total_techniques)*100,0) | sort 0 coverage_pct -max_risk | table mitre_tactic coverage_pct total_techniques gap_count max_risk
iseval = 0

# ===========================================================================
# v2.0.0 — ENTERPRISE SECURITY EDITION macros
# ---------------------------------------------------------------------------
# These read index=risk (RBA) and index=notable (Incident Review) — the SAME
# indexes ES populates. In Demo mode the streamer seeds them with ES-shaped
# data (and wipes prior seeds each stream, so index=risk only ever holds the
# current scenario); on a live ES deployment they read the real thing. ONE code
# path, both modes — no scenario filter needed, which is also what makes them
# correct against real ES data (which has no scenario_id).
# ===========================================================================

# --- ES-scoped entity filter. Keys on risk_object (the canonical Risk/Notable
# data-model field) so entity="*" matches all RBA + notable rows in BOTH the
# seeded demo data and a real ES deployment.
[ar_es_entity(1)]
args = entity
definition = (risk_object="$entity$" OR orig_host="$entity$" OR user="$entity$" OR src="$entity$" OR dest="$entity$" OR dest_host="$entity$")
iseval = 0

# --- ES presence probe: are there enabled ES correlation searches on this box?
[ar_es_present]
definition = | rest /servicesNS/-/-/saved/searches splunk_server=local count=0 | search (action.correlationsearch.enabled=1 OR action.notable=1) | stats count AS cs | eval es_present=if(cs>0,1,0) | append [| makeresults | eval es_present=0 | fields es_present] | stats max(es_present) AS es_present
iseval = 0

# --- Does index=risk hold any RBA data right now? (drives graceful-empty guard)
[ar_rba_data_check]
definition = search index=risk | head 1 | stats count AS has_data | append [| makeresults | eval has_data=0 | fields has_data] | stats max(has_data) AS has_data
iseval = 0

# --- Top risk objects by accumulated RBA score, with breach status vs threshold
[ar_rba_risk_objects(1)]
args = entity
definition = search index=risk `ar_es_entity($entity$)` | stats sum(calculated_risk_score) AS total_risk dc(source) AS contributing_rules count AS risk_events values(mitre_tactic) AS tactics_seen max(_time) AS last_epoch BY risk_object risk_object_type | eval threshold=100 | eval status=if(total_risk>=threshold,"NOTABLE FIRED","accruing") | eval last_seen=strftime(last_epoch,"%H:%M:%S") | sort 0 -total_risk | head 15 | table risk_object risk_object_type total_risk threshold contributing_rules risk_events status last_seen
iseval = 0

# --- RBA risk accrual over time (cumulative per object) — SPL companion to the JS hero chart
[ar_rba_timeline(1)]
args = entity
definition = search index=risk `ar_es_entity($entity$)` | timechart span=2m sum(calculated_risk_score) AS risk BY risk_object limit=8 useother=f | streamstats global=f sum(*) AS * | fillnull value=0
iseval = 0

# --- RBA notables: which objects crossed the threshold and fired a Risk Notable
[ar_rba_breaches(1)]
args = entity
definition = search index=notable `ar_es_entity($entity$)` rule_name="ATT&CK Risk Threshold Exceeded*" | sort 0 _time | eval fired=strftime(_time,"%H:%M:%S") | table fired risk_object aggregate_risk contributing_rules mitre_tactics urgency
iseval = 0

# --- Incident Review: notable events as ES would queue them (urgency / status / owner)
[ar_notable_review(1)]
args = entity
definition = search index=notable `ar_es_entity($entity$)` | eval _u=case(urgency=="critical",5,urgency=="high",4,urgency=="medium",3,urgency=="low",2,1==1,1) | sort 0 -_u -_time | eval time=strftime(_time,"%H:%M:%S"), entity=coalesce(risk_object,orig_host,src,user,dest_host,"-") | head 25 | table time rule_name urgency status_label owner entity mitre_technique security_domain risk_score
iseval = 0

# --- Notable KPI: total notables + how many are high/critical (the queue pressure)
[ar_notable_kpi(1)]
args = entity
definition = search index=notable `ar_es_entity($entity$)` | stats count AS total sum(eval(if(urgency=="high" OR urgency=="critical",1,0))) AS high_critical | append [| makeresults | eval total=0, high_critical=0 | fields total high_critical] | stats max(total) AS total max(high_critical) AS high_critical
iseval = 0

# --- Correlation-search-aware coverage: observed techniques x detection that would fire.
# Lookup gives the ESCU-default posture; a left-join to live REST upgrades a technique
# to covered if THIS box actually has an enabled correlation search referencing it.
[ar_corr_coverage(1)]
args = entity
definition = search index=risk `ar_es_entity($entity$)` mitre_technique=* | stats count AS risk_events sum(calculated_risk_score) AS accumulated_risk values(mitre_tactic) AS mitre_tactic max(risk_score) AS peak_risk BY mitre_technique | lookup ar_technique_correlation_map mitre_technique OUTPUT correlation_search security_domain coverage_status | eval coverage_status=coalesce(coverage_status,"none") | join type=left mitre_technique [| rest /servicesNS/-/-/saved/searches splunk_server=local count=0 | search action.correlationsearch.enabled=1 | eval _txt=coalesce(search,"")." ".coalesce(description,"")." ".coalesce('action.correlationsearch.label',"") | rex field=_txt "(?<mitre_technique>T\d{4}(?:\.\d{3})?)" max_match=0 | where isnotnull(mitre_technique) | mvexpand mitre_technique | stats values(title) AS live_search BY mitre_technique] | eval coverage_status=if(isnotnull(live_search),"enabled",coverage_status) | eval covered=if(coverage_status=="enabled",1,0) | eval detection=case(coverage_status=="enabled","✓ ".coalesce(mvjoin(live_search,", "),correlation_search), coverage_status=="disabled","✗ DISABLED — ".correlation_search, 1==1,"✗ NO DETECTION") | sort 0 -peak_risk -accumulated_risk | table mitre_technique mitre_tactic risk_events peak_risk detection coverage_status
iseval = 0

# --- Single coverage % (enabled / observed) — the headline Detection Coverage Score
[ar_corr_coverage_score(1)]
args = entity
definition = search index=risk `ar_es_entity($entity$)` mitre_technique=* | stats count AS e BY mitre_technique | lookup ar_technique_correlation_map mitre_technique OUTPUT coverage_status | eval coverage_status=coalesce(coverage_status,"none") | eval covered=if(coverage_status=="enabled",1,0) | stats count AS total sum(covered) AS covered | eval count=if(total>0,round((covered/total)*100,0),0) | fields count
iseval = 0

# --- Count of high-risk observed techniques with NO enabled detection (true blind spots)
[ar_corr_gap_count(1)]
args = entity
definition = search index=risk `ar_es_entity($entity$)` mitre_technique=* | stats max(risk_score) AS peak_risk BY mitre_technique | lookup ar_technique_correlation_map mitre_technique OUTPUT coverage_status | eval coverage_status=coalesce(coverage_status,"none") | where coverage_status!="enabled" AND peak_risk>=70 | stats count AS count | append [| makeresults | eval count=0 | fields count] | stats max(count) AS count
iseval = 0

# --- RBA -> ATT&CK heatmap: accumulated risk per tactic x technique (ES Risk Analysis view)
[ar_rba_attack_heatmap(1)]
args = entity
definition = search index=risk `ar_es_entity($entity$)` mitre_technique=* | stats sum(calculated_risk_score) AS accumulated_risk dc(risk_object) AS objects max(risk_score) AS peak BY mitre_tactic mitre_technique | lookup ar_technique_correlation_map mitre_technique OUTPUT coverage_status | eval coverage_status=coalesce(coverage_status,"none") | sort 0 mitre_tactic -accumulated_risk | table mitre_tactic mitre_technique accumulated_risk objects peak coverage_status
iseval = 0
