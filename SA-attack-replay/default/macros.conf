iseval = 0

[ar_max_risk_live(2)]
args = entity, scenario
definition = search index=* NOT index=sa_attack_sim (`ar_entity_filter($entity$)` OR "$entity$"="*") (tag=alert OR tag=attack OR risk_score=* OR mitre_technique=*) | eval _risk = coalesce(risk_score, severity_id, case(severity=="critical",100,severity=="high",80,severity=="medium",50,severity=="low",20,true(),null())) | stats max(_risk) AS count | append [| makeresults | eval count=0 | fields count] | stats max(count) AS count
iseval = 0

[ar_events_by_phase(2)]
args = entity, scenario
definition = search index=sa_attack_sim `ar_entity_filter($entity$)` `ar_scenario_filter($scenario$)` kill_chain_phase=* | bin _time span=5m | stats count BY _time kill_chain_phase | xyseries _time kill_chain_phase count
iseval = 0

