# props.conf — SA-attack-replay
# Field aliases (FIELDALIAS-*) and EVAL fields (EVAL-*) that map the
# synthetic demo-event field names onto the CIM-required fields for
# each data model. Lets `| tstats` against Authentication, Endpoint,
# Network_Traffic, Web, Email, and Change data models populate from
# our synthetic events without any external TA installed.

# ============================================================================
# WinEventLog:Security
# Feeds: Authentication (4624/4625/4768/4769),
#        Endpoint.Processes (4688),
#        Change (1102 log clear, 4698 task create, 4662 DCSync object access)
# ============================================================================
[WinEventLog:Security]
FIELDALIAS-host_to_dest        = host AS dest
FIELDALIAS-host_to_src_secldap = host AS src
FIELDALIAS-src_user_to_user    = src_user AS user
FIELDALIAS-src_ip_to_src       = src_ip AS src
FIELDALIAS-dest_ip_to_dest     = dest_ip AS dest
FIELDALIAS-EventCode_to_sig    = EventCode AS signature_id
FIELDALIAS-task_name_to_object = task_name AS object
FIELDALIAS-object_type_to_obj  = object_type AS object
EVAL-app             = "win:security"
EVAL-vendor          = "Microsoft"
EVAL-product         = "Windows"
EVAL-vendor_product  = "Microsoft Windows"
EVAL-action          = case(EventCode=4624,"success", EventCode=4625,"failure", EventCode=4768,"success", EventCode=4769,"success", EventCode=4688,"allowed", EventCode=1102,"cleared", EventCode=4698,"created", EventCode=4662,"read", true(),"unknown")
EVAL-authentication_method = case(EventCode=4768 OR EventCode=4769,"Kerberos", EventCode=4624 AND logon_type=3,"NTLM", EventCode=4624 AND logon_type=10,"RemoteInteractive", EventCode=4624,"Other", true(),null())
EVAL-signature       = case(EventCode=4624,"An account was successfully logged on", EventCode=4625,"An account failed to log on", EventCode=4688,"A new process has been created", EventCode=4698,"A scheduled task was created", EventCode=1102,"The audit log was cleared", EventCode=4662,"An operation was performed on an object", EventCode=4768,"A Kerberos authentication ticket (TGT) was requested", EventCode=4769,"A Kerberos service ticket was requested", true(),"Windows Security Event")
EVAL-process_name    = if(isnotnull(process), mvindex(split(process,"\\"),-1), null())
EVAL-parent_process_name = if(isnotnull(parent_process), mvindex(split(parent_process,"\\"),-1), null())
EVAL-object_category = case(EventCode=4698,"task", EventCode=4662,"directory_service", EventCode=1102,"audit_log", true(),null())
EVAL-change_type     = case(EventCode=4698,"created", EventCode=1102,"deleted", true(),null())
EVAL-status          = case(EventCode=4624 OR EventCode=4768 OR EventCode=4769,"success", EventCode=4625,"failure", true(),null())

# ============================================================================
# WinEventLog:Sysmon
# Feeds: Endpoint.Processes (1, 7, 10),
#        Endpoint.Filesystem (11),
#        Network_Traffic.All_Traffic (3)
# ============================================================================
[WinEventLog:Sysmon]
FIELDALIAS-sm_host_to_dest        = host AS dest
FIELDALIAS-sm_src_user_to_user    = src_user AS user
FIELDALIAS-sm_src_ip_to_src       = src_ip AS src
FIELDALIAS-sm_dest_ip_to_dest_ip  = dest_ip AS dest
FIELDALIAS-sm_file_hash_to_hash   = file_hash AS file_hash_md5
FIELDALIAS-sm_target_process      = target_process AS process_target
EVAL-app             = "sysmon"
EVAL-vendor          = "Microsoft"
EVAL-product         = "Sysmon"
EVAL-vendor_product  = "Microsoft Sysmon"
EVAL-action          = case(EventCode=1,"allowed", EventCode=3,"allowed", EventCode=7,"allowed", EventCode=10,"allowed", EventCode=11,"created", true(),"unknown")
EVAL-process_name    = if(isnotnull(process), mvindex(split(process,"\\"),-1), null())
EVAL-parent_process_name = if(isnotnull(parent_process), mvindex(split(parent_process,"\\"),-1), null())
EVAL-file_name       = if(EventCode=11 AND isnotnull(process), mvindex(split(process,"\\"),-1), null())
EVAL-file_path       = if(EventCode=11, process, null())
EVAL-file_hash       = file_hash
EVAL-transport       = case(EventCode=3,"tcp", true(),null())
EVAL-protocol        = case(EventCode=3,"tcp", true(),null())
EVAL-bytes           = case(EventCode=3, coalesce(bytes_in,0)+coalesce(bytes_out,0), true(),null())
EVAL-bytes_in        = bytes_in
EVAL-bytes_out       = bytes_out
EVAL-signature       = case(EventCode=1,"Process Create", EventCode=3,"Network Connection", EventCode=7,"Image Loaded", EventCode=10,"Process Access", EventCode=11,"File Create", true(),"Sysmon Event")
EVAL-signature_id    = EventCode

# ============================================================================
# stream:http
# Feeds: Web + Network_Traffic.All_Traffic
# ============================================================================
[stream:http]
FIELDALIAS-h_host_to_dest      = host AS dest
FIELDALIAS-h_src_ip_to_src     = src_ip AS src
FIELDALIAS-h_dest_ip_to_dest   = dest_ip AS dest
FIELDALIAS-h_src_user_to_user  = src_user AS user
EVAL-app             = "stream:http"
EVAL-vendor          = "Splunk"
EVAL-product         = "Stream"
EVAL-vendor_product  = "Splunk Stream HTTP"
EVAL-action          = case(isnotnull(status) AND status>=400, "blocked", true(),"allowed")
EVAL-transport       = "tcp"
EVAL-protocol        = "http"
EVAL-bytes_in        = coalesce(bytes_in,0)
EVAL-bytes_out       = coalesce(bytes_out,0)
EVAL-bytes           = coalesce(bytes_in,0) + coalesce(bytes_out,0)
EVAL-status          = coalesce(status,"200")
EVAL-http_user_agent = coalesce(http_user_agent,"Mozilla/5.0")
EVAL-uri_path        = coalesce(url,"/")
EVAL-url             = if(isnotnull(url), "https://" . coalesce(dest_ip,"unknown") . url, "https://" . coalesce(dest_ip,"unknown") . "/")
EVAL-http_method     = coalesce(http_method,"GET")
EVAL-site            = coalesce(dest_ip,"unknown")
EVAL-category        = "uncategorized"

# ============================================================================
# stream:mysql
# Feeds: Network_Traffic.All_Traffic (Database query channel)
# ============================================================================
[stream:mysql]
FIELDALIAS-m_host_to_dest      = host AS dest
FIELDALIAS-m_src_ip_to_src     = src_ip AS src
FIELDALIAS-m_dest_ip_to_dest   = dest_ip AS dest
FIELDALIAS-m_src_user_to_user  = src_user AS user
EVAL-app             = "stream:mysql"
EVAL-vendor          = "Splunk"
EVAL-product         = "Stream"
EVAL-vendor_product  = "Splunk Stream MySQL"
EVAL-action          = "allowed"
EVAL-transport       = "tcp"
EVAL-protocol        = "mysql"
EVAL-dest_port       = coalesce(dest_port,3306)
EVAL-bytes           = coalesce(bytes,1024)
EVAL-bytes_in        = coalesce(bytes_in,512)
EVAL-bytes_out       = coalesce(bytes_out,512)

# ============================================================================
# stream:tcp
# Feeds: Network_Traffic.All_Traffic
# ============================================================================
[stream:tcp]
FIELDALIAS-t_host_to_dest      = host AS dest
FIELDALIAS-t_src_ip_to_src     = src_ip AS src
FIELDALIAS-t_dest_ip_to_dest   = dest_ip AS dest
EVAL-app             = "stream:tcp"
EVAL-vendor          = "Splunk"
EVAL-product         = "Stream"
EVAL-vendor_product  = "Splunk Stream TCP"
EVAL-action          = "allowed"
EVAL-transport       = "tcp"
EVAL-protocol        = "tcp"
EVAL-bytes           = coalesce(bytes,0)
EVAL-bytes_in        = coalesce(bytes_in,0)
EVAL-bytes_out       = coalesce(bytes_out,0)

# ============================================================================
# linux:auth
# Feeds: Authentication.Authentication (SSH logins)
# ============================================================================
[linux:auth]
FIELDALIAS-l_host_to_dest        = host AS dest
FIELDALIAS-l_src_ip_to_src       = src_ip AS src
FIELDALIAS-l_src_user_to_user    = src_user AS user
FIELDALIAS-l_auth_method_to_meth = auth_method AS authentication_method
EVAL-app             = "ssh"
EVAL-vendor          = "Linux"
EVAL-product         = "OpenSSH"
EVAL-vendor_product  = "Linux OpenSSH"
EVAL-action          = "success"
EVAL-signature       = "SSH authentication"
EVAL-src_user_id     = src_user

# ============================================================================
# MSExchange:Management
# Feeds: Email + Change (mailbox export cmdlets, etc.)
# ============================================================================
[MSExchange:Management]
FIELDALIAS-e_host_to_dest        = host AS dest
FIELDALIAS-e_src_user_to_user    = src_user AS user
FIELDALIAS-e_cmdlet_to_object    = cmdlet AS object
FIELDALIAS-e_mailboxes_to_recip  = mailboxes AS recipient
EVAL-app             = "exchange"
EVAL-vendor          = "Microsoft"
EVAL-product         = "Exchange"
EVAL-vendor_product  = "Microsoft Exchange"
EVAL-action          = case(like(cmdlet,"%Export%"),"exported", like(cmdlet,"%Remove%"),"deleted", like(cmdlet,"%New%"),"created", like(cmdlet,"%Set%"),"modified", true(),"executed")
EVAL-object_category = "mailbox"
EVAL-change_type     = case(like(cmdlet,"%New%"),"created", like(cmdlet,"%Remove%"),"deleted", like(cmdlet,"%Set%"),"modified", like(cmdlet,"%Export%"),"exported", true(),"AAA")
EVAL-signature       = cmdlet

# ============================================================================
# attack_sim:creds — synthesized credential-dump notable
# Feeds: Authentication (attack tag) + alerts
# ============================================================================
[attack_sim:creds]
FIELDALIAS-c_host_to_dest        = host AS dest
FIELDALIAS-c_src_user_to_user    = src_user AS user
FIELDALIAS-c_src_ip_to_src       = src_ip AS src
EVAL-app             = "attack-replay"
EVAL-vendor          = "DataDay"
EVAL-product         = "Attack Replay"
EVAL-vendor_product  = "SA-attack-replay"
EVAL-action          = "failure"
EVAL-signature       = coalesce(description,"Credential dump")
EVAL-authentication_method = "Credential Dump"
EVAL-severity_id     = case(severity="critical",5, severity="high",4, severity="medium",3, severity="low",2, true(),1)

# ============================================================================
# attack_sim:notable — generic correlation notable
# Feeds: Alerts data model
# ============================================================================
[attack_sim:notable]
FIELDALIAS-n_host_to_dest        = host AS dest
FIELDALIAS-n_src_user_to_user    = src_user AS user
FIELDALIAS-n_src_ip_to_src       = src_ip AS src
FIELDALIAS-n_description_to_sig  = description AS signature
EVAL-app             = "attack-replay"
EVAL-vendor          = "DataDay"
EVAL-product         = "Attack Replay"
EVAL-vendor_product  = "SA-attack-replay"
EVAL-severity_id     = case(severity="critical",5, severity="high",4, severity="medium",3, severity="low",2, true(),1)
EVAL-mitre_attack_id = mitre_technique

# -----------------------------------------------------------------------------
# attack_sim:events  --  the sourcetype the demo_streamer.js actually writes
#   (Phase 4 sourcetype-splitting refactor not fully fired; events land here.)
# Force KV extraction, alias orig_host -> host so dashboards see real hostnames,
# alias orig_sourcetype -> sourcetype_orig for inspection.
# -----------------------------------------------------------------------------
[attack_sim:events]
SHOULD_LINEMERGE = false
KV_MODE = auto
EXTRACT-attack_sim_fields = (?:^|,\s*)(?P<_KEY_1>[a-zA-Z_][a-zA-Z0-9_]*)=(?:"(?P<_VAL_1>[^"]*)"|(?P<_VAL_2>[^,]*))
FIELDALIAS-attack_sim_host = orig_host AS host
FIELDALIAS-attack_sim_st = orig_sourcetype AS sourcetype_orig
EVAL-scenario_id = case(scenario="Operation Midnight Eclipse","op_midnight_eclipse",scenario="Operation Ironclaw","op_ironclaw",scenario="Operation Silent Drift","op_silent_drift",true(),null())
