# savedsearches.conf -- SA-attack-replay
#
# ES-style correlation searches that would detect each scenario's malicious
# activity. All searches are DISABLED by default (enableSched = 0) -- they
# are examples/templates demonstrating CIM/RBA-aligned detection logic, not
# auto-running alerts.
#
# Each search includes:
#   * action.notable (ES Notable Event creation) -- harmless if ES not installed
#   * action.risk    (ES Risk-Based Alerting)
#   * MITRE technique references in description
#   * alert.severity aligned to ES severity scale (1=info..5=critical)
#   * dispatch.earliest_time / latest_time for ad-hoc runs from the UI
#
# Scenarios covered:
#   op_midnight_eclipse (APT-29): #1 PowerShell, #2 LSASS, #3 DCSync
#   op_ironclaw (Ransomware):     #4 Mass file encryption, #5 VSS deletion
#   op_silent_drift (Insider):    #6 Bulk data access, #7 Cloud exfiltration


# =============================================================================
# Scenario: op_midnight_eclipse (APT-29)
# =============================================================================

[Attack Replay - Encoded PowerShell from Office Macro]
description = Detects encoded PowerShell launched as a child of an Office productivity application (Word/Excel/Outlook). This pattern is a hallmark of macro-based initial access (T1204.002 User Execution: Malicious File) followed by obfuscated command execution (T1059.001 PowerShell, T1027 Obfuscated Files or Information).
search = | tstats summariesonly=false count min(_time) AS firstTime max(_time) AS lastTime values(Processes.command_line) AS command_line values(Processes.parent_process_name) AS parent_process values(Processes.user) AS user FROM datamodel=Endpoint.Processes \
    WHERE Processes.process_name="powershell.exe" \
        AND Processes.parent_process_name IN ("WINWORD.EXE","EXCEL.EXE","OUTLOOK.EXE","POWERPNT.EXE") \
        AND (Processes.command_line="*-enc*" OR Processes.command_line="*-EncodedCommand*" OR Processes.command_line="*FromBase64String*") \
    BY Processes.dest Processes.user Processes.process_name \
    | `drop_dm_object_name(Processes)` \
    | convert ctime(firstTime) ctime(lastTime)
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_visible = 1
alert.severity = 4
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = Encoded PowerShell from Office Macro
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
action.notable.param.rule_description = Encoded PowerShell process launched from an Office application -- classic macro-dropper pattern. MITRE: T1204.002, T1059.001, T1027.
action.risk = 1
action.risk.param._risk_score = 80
action.risk.param._risk_message = Suspicious encoded PowerShell from Office parent on $dest$ by $user$
action.risk.param._risk_object = dest
action.risk.param._risk_object_type = system
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius


[Attack Replay - LSASS Memory Access (Credential Dumping)]
description = Detects a process opening a handle to lsass.exe with credential-dumping access rights. Classic Mimikatz / pwdump / SafetyKatz behavior. MITRE: T1003.001 OS Credential Dumping: LSASS Memory.
search = search index=sa_attack_sim sourcetype="WinEventLog:Sysmon" EventCode=10 target_process="*lsass.exe*" \
    | eval suspicious_access=if(match(granted_access,"(?i)0x1010|0x1410|0x1438|0x143a"), 1, 0) \
    | where suspicious_access=1 OR NOT match(process,"(?i)svchost\.exe|MsMpEng\.exe|wininit\.exe|services\.exe") \
    | eval host=coalesce(orig_host,host) \
    | stats count min(_time) AS firstTime max(_time) AS lastTime values(process) AS source_process values(src_user) AS user values(granted_access) AS granted_access BY host \
    | convert ctime(firstTime) ctime(lastTime)
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_visible = 1
alert.severity = 5
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = LSASS Memory Access (Credential Dumping)
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
action.notable.param.rule_description = Non-system process opened lsass.exe with credential-dumping access rights. MITRE: T1003.001.
action.risk = 1
action.risk.param._risk_score = 95
action.risk.param._risk_message = LSASS credential dumping attempt on $host$ by $source_process$
action.risk.param._risk_object = host
action.risk.param._risk_object_type = system
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius


[Attack Replay - DCSync Detected]
description = Detects a non-DC account performing directory replication (DS-Replication-Get-Changes / DS-Replication-Get-Changes-All), the signature of a DCSync attack used to extract krbtgt or other domain-secret hashes. MITRE: T1003.006 OS Credential Dumping: DCSync.
search = search index=sa_attack_sim sourcetype="WinEventLog:Security" EventCode=4662 object_type="*Replication-Get-Changes*" \
    | eval src_user_lower=lower(src_user) \
    | where NOT match(src_user_lower,"^(.*\$|krbtgt|administrator@.*)$") \
    | eval host=coalesce(orig_host,host) \
    | stats count min(_time) AS firstTime max(_time) AS lastTime values(src_ip) AS src_ip values(object_type) AS object_type BY host src_user \
    | convert ctime(firstTime) ctime(lastTime)
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_visible = 1
alert.severity = 5
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = DCSync Detected
action.notable.param.security_domain = identity
action.notable.param.severity = critical
action.notable.param.rule_description = Directory replication requested by a non-DC account -- DCSync credential-extraction attack. MITRE: T1003.006.
action.risk = 1
action.risk.param._risk_score = 100
action.risk.param._risk_message = DCSync attack from $src_user$ against $host$
action.risk.param._risk_object = src_user
action.risk.param._risk_object_type = user
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius


# =============================================================================
# Scenario: op_ironclaw (Ransomware)
# =============================================================================

[Attack Replay - Mass File Encryption Activity]
description = Detects a single process creating an unusually high rate of files within a short window -- the fingerprint of bulk encryption by ransomware. Looks at Sysmon EC=11 file create events and counts per-process unique target files. MITRE: T1486 Data Encrypted for Impact.
search = search index=sa_attack_sim sourcetype="WinEventLog:Sysmon" EventCode=11 \
    | eval extension=lower(replace(target_filename,"^.*\.",".")) \
    | bin _time span=1m \
    | eval host=coalesce(orig_host,host) \
    | stats count AS file_writes dc(target_filename) AS unique_files values(extension) AS extensions BY _time host process \
    | eval suspicious_extension=if(match(mvjoin(extensions,","),"(?i)\.(locked|encrypted|crypt|enc|ironclaw|wcry|wnry|locky|zepto|cerber|ryk|conti)"),1,0) \
    | where file_writes >= 10 OR (suspicious_extension=1 AND file_writes >= 5) \
    | sort 0 -file_writes
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_visible = 1
alert.severity = 5
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = Mass File Encryption Activity
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
action.notable.param.rule_description = High-rate file creation by a single process within a 1-minute window, consistent with ransomware encryption. MITRE: T1486.
action.risk = 1
action.risk.param._risk_score = 95
action.risk.param._risk_message = Possible ransomware encryption on $host$ by $process$ ($file_writes$ files/min)
action.risk.param._risk_object = host
action.risk.param._risk_object_type = system
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius


[Attack Replay - Volume Shadow Copy Deletion]
description = Detects deletion of Volume Shadow Copies via vssadmin.exe or wmic.exe shadowcopy. Ransomware uses this to inhibit recovery before encryption. MITRE: T1490 Inhibit System Recovery.
search = | tstats summariesonly=false count min(_time) AS firstTime max(_time) AS lastTime values(Processes.command_line) AS command_line values(Processes.user) AS user FROM datamodel=Endpoint.Processes \
    WHERE (Processes.process_name IN ("vssadmin.exe","wmic.exe","wbadmin.exe","powershell.exe","cmd.exe","bcdedit.exe") \
        AND (Processes.command_line="*delete*shadow*" OR Processes.command_line="*shadowcopy*delete*" OR Processes.command_line="*Delete-VssShadowStorage*" OR Processes.command_line="*resize*shadowstorage*" OR Processes.command_line="*recoveryenabled*no*" OR Processes.command_line="*bootstatuspolicy*ignoreallfailures*")) \
    BY Processes.dest Processes.process_name \
    | `drop_dm_object_name(Processes)` \
    | convert ctime(firstTime) ctime(lastTime)
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
is_visible = 1
alert.severity = 5
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = Volume Shadow Copy Deletion
action.notable.param.security_domain = endpoint
action.notable.param.severity = critical
action.notable.param.rule_description = Volume Shadow Copies or recovery configuration tampered with -- standard ransomware recovery-inhibition step. MITRE: T1490.
action.risk = 1
action.risk.param._risk_score = 90
action.risk.param._risk_message = Shadow copy deletion on $dest$ by $process_name$
action.risk.param._risk_object = dest
action.risk.param._risk_object_type = system
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius


# =============================================================================
# Scenario: op_silent_drift (Insider)
# =============================================================================

[Attack Replay - Anomalous Bulk Data Access by Privileged User]
description = Detects a single user pulling an unusually large volume of data from internal data stores (database/file shares) inside a short window. Insider-threat indicator -- legitimate credentials, abnormal volume. MITRE: T1213 Data from Information Repositories, T1078 Valid Accounts.
search = | tstats summariesonly=false sum(All_Traffic.bytes_in) AS bytes_in sum(All_Traffic.bytes_out) AS bytes_out count AS connections FROM datamodel=Network_Traffic.All_Traffic \
    WHERE All_Traffic.dest_port IN (3306,1433,5432,1521,445,2049,8983) AND All_Traffic.user!="-" AND All_Traffic.user!="unknown" \
    BY All_Traffic.user All_Traffic.src All_Traffic.dest \
    | `drop_dm_object_name(All_Traffic)` \
    | eval mb_in=round(bytes_in/1024/1024,1) \
    | where mb_in >= 100 OR connections >= 50 \
    | sort 0 -mb_in
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -60m
dispatch.latest_time = now
is_visible = 1
alert.severity = 3
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = Anomalous Bulk Data Access by Privileged User
action.notable.param.security_domain = access
action.notable.param.severity = medium
action.notable.param.rule_description = User pulled an abnormal volume of data from internal data stores. Investigate against baseline. MITRE: T1213, T1078.
action.risk = 1
action.risk.param._risk_score = 60
action.risk.param._risk_message = $user$ accessed $mb_in$ MB from internal data stores in last hour
action.risk.param._risk_object = user
action.risk.param._risk_object_type = user
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius


[Attack Replay - Cloud Storage Exfiltration]
description = Detects outbound HTTP/S transfers to known consumer-cloud storage destinations with significant upload volume. Targets dropbox.com, *.s3.amazonaws.com, drive.google.com, *.googleapis.com, mega.nz, wetransfer.com, file.io and similar. MITRE: T1567 Exfiltration Over Web Service, T1041 Exfiltration Over C2 Channel.
search = search index=sa_attack_sim (sourcetype="stream:http" OR tag=web) \
    (dest_host="*.s3.amazonaws.com" OR dest_host="*.dropbox.com" OR dest_host="*.dropboxusercontent.com" OR dest_host="*drive.google.com" OR dest_host="*.googleapis.com" OR dest_host="*.mega.nz" OR dest_host="*.wetransfer.com" OR dest_host="*file.io" OR url="*s3.amazonaws.com*" OR url="*dropbox.com*" OR url="*mega.nz*") \
    | eval mb_out=round(bytes_out/1024/1024,2) \
    | stats sum(bytes_out) AS total_bytes_out sum(mb_out) AS total_mb_out count AS uploads values(dest_host) AS dest_host values(url) AS url min(_time) AS firstTime max(_time) AS lastTime BY host src_user src_ip \
    | where total_mb_out >= 10 OR uploads >= 5 \
    | convert ctime(firstTime) ctime(lastTime) \
    | sort 0 -total_mb_out
cron_schedule = */5 * * * *
enableSched = 0
dispatch.earliest_time = -60m
dispatch.latest_time = now
is_visible = 1
alert.severity = 4
alert.suppress = 0
alert.track = 1
action.notable = 1
action.notable.param.rule_title = Cloud Storage Exfiltration
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.rule_description = Outbound transfer to consumer cloud storage with significant upload volume. MITRE: T1567, T1041.
action.risk = 1
action.risk.param._risk_score = 75
action.risk.param._risk_message = $src_user$ uploaded $total_mb_out$ MB to $dest_host$ from $host$
action.risk.param._risk_object = src_user
action.risk.param._risk_object_type = user
request.ui_dispatch_app = SA-attack-replay
request.ui_dispatch_view = blast_radius

# ============================================================================
# Summary-index saved searches (Fix F — real Splunk operational pattern)
# These run on cron and roll up KPI data into summary_sa_attack_replay.
# Dashboard panels query the summary index for sub-second load instead of
# re-running full searches on every refresh.
# ============================================================================

[sar_kpi_rollup_5m]
search = index=sa_attack_sim earliest=-5m@m latest=now \
  | stats count as events, dc(orig_host) as hosts, max(risk_score) as max_risk, dc(mitre_technique) as techniques by scenario_id \
  | eval _time=now() \
  | collect index=summary_sa_attack_replay sourcetype=sar:kpi_rollup
cron_schedule = */5 * * * *
disabled = 0
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 0
is_visible = 1
description = Rolls up KPI metrics every 5 minutes into summary_sa_attack_replay. Disabled by default; enable in production for sub-second dashboard load.

[sar_tactic_rollup_15m]
search = index=sa_attack_sim earliest=-15m@m latest=now mitre_tactic=* \
  | stats count as events, max(risk_score) as max_risk by scenario_id, mitre_tactic \
  | eval _time=now() \
  | collect index=summary_sa_attack_replay sourcetype=sar:tactic_rollup
cron_schedule = */15 * * * *
disabled = 0
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0
is_visible = 1
description = Aggregates MITRE tactic distribution every 15 minutes. Disabled by default; enable in production to power the tactic donut chart from summary index instead of raw search.

[sar_host_rollup_1h]
search = index=sa_attack_sim earliest=-1h@h latest=now orig_host=* \
  | stats count as events, max(risk_score) as peak_risk, dc(mitre_tactic) as tactic_count, latest(_time) as last_seen by scenario_id, orig_host \
  | eval _time=now() \
  | collect index=summary_sa_attack_replay sourcetype=sar:host_rollup
cron_schedule = 0 * * * *
disabled = 0
dispatch.earliest_time = -1h@h
dispatch.latest_time = now
enableSched = 0
is_visible = 1
description = Hourly per-host rollup. Disabled by default; enable for fast Host Blast Radius rendering from summary index.
