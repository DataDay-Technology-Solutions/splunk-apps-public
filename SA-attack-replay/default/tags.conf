# tags.conf — SA-attack-replay
# Applies CIM data-model tags to the eventtypes defined in eventtypes.conf.
# Tags drive which Splunk_SA_CIM data models each event populates
# (Authentication, Endpoint, Network_Traffic, Web, Email, Change, Alerts).
# Stanza format: [eventtype=NAME] with `tagname = enabled` keys.

[eventtype=ar_windows_logon_success]
authentication = enabled

[eventtype=ar_windows_logon_failure]
authentication = enabled

[eventtype=ar_kerberos_ticket]
authentication = enabled

[eventtype=ar_linux_auth]
authentication = enabled

[eventtype=ar_windows_process_create]
process = enabled
endpoint = enabled

[eventtype=ar_sysmon_process_create]
process = enabled
endpoint = enabled

[eventtype=ar_sysmon_process_access]
process = enabled
endpoint = enabled

[eventtype=ar_sysmon_image_load]
process = enabled
endpoint = enabled

[eventtype=ar_sysmon_file_create]
endpoint = enabled
filesystem = enabled

[eventtype=ar_sysmon_network_conn]
network = enabled
communicate = enabled

[eventtype=ar_stream_tcp]
network = enabled
communicate = enabled

[eventtype=ar_stream_mysql]
network = enabled
communicate = enabled

[eventtype=ar_stream_http]
web = enabled
network = enabled
communicate = enabled

[eventtype=ar_exchange_mgmt]
email = enabled
change = enabled

[eventtype=ar_security_log_cleared]
change = enabled
audit = enabled

[eventtype=ar_security_task_created]
change = enabled

[eventtype=ar_security_dcsync]
authentication = enabled
attack = enabled

[eventtype=ar_attack_sim_creds]
authentication = enabled
attack = enabled
alert = enabled

[eventtype=ar_attack_sim_notable]
alert = enabled
attack = enabled
