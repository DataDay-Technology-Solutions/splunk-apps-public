# transforms.conf — SA-attack-replay
# All field normalization for the synthetic demo events is handled
# inline via FIELDALIAS-* and EVAL-* directives in props.conf, so
# this file does not currently define any REPORT-* or LOOKUP-*
# transforms. Kept as a placeholder for future field extractions.
# (btool requires the file exist if props.conf REPORT-* clauses are
# added later — pre-creating it avoids "unknown transform" errors.)

# Recommended Actions IR playbook lookup (data-driven Row 7 panel)
[ar_recommendations_lookup]
filename = ar_recommendations.csv
case_sensitive_match = false
